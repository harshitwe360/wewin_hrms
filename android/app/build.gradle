plugins {
    id "com.android.application"
    id "kotlin-android"
    id "dev.flutter.flutter-gradle-plugin"
}

def keystoreProperties = new Properties()
def keystorePropertiesFile = rootProject.file('key.properties')
if (keystorePropertiesFile.exists()) {
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
}

// Release signing needs android/key.properties (gitignored; copy
// android/key.properties and fill it in). Fail early with a clear
// message instead of Gradle's "missing required property storeFile".
gradle.taskGraph.whenReady { graph ->
    def needsRelease = graph.allTasks.any { it.name.toLowerCase().contains("release") }
    if (!needsRelease) return
    def missing = ['storeFile', 'storePassword', 'keyAlias', 'keyPassword'].findAll {
        !keystoreProperties[it]
    }
    if (!keystorePropertiesFile.exists() || !missing.isEmpty()) {
        throw new GradleException(
            "Release signing is not configured: " +
            (keystorePropertiesFile.exists()
                ? "android/key.properties is missing ${missing.join(', ')}."
                : "android/key.properties not found.") +
            " Copy android/key.properties to android/key.properties and fill in the keystore details.")
    }
    def store = file(keystoreProperties['storeFile'])
    if (!store.exists()) {
        throw new GradleException(
            "Release keystore not found at ${store.path} (storeFile in android/key.properties is relative to android/app).")
    }
}

android {
    namespace = "com.wewin.attendance"
    compileSdk = flutter.compileSdkVersion
    ndkVersion = "27.0.12077973"

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_11
        targetCompatibility = JavaVersion.VERSION_11
    }

    lintOptions {
        disable 'InvalidPackage'
    }

    kotlinOptions {
        jvmTarget = JavaVersion.VERSION_11.toString()
    }

    defaultConfig {
        applicationId = "com.wewin.attendance"
        minSdk = rootProject.ext.minSdkVersion //flutter.minSdkVersion
        targetSdk = flutter.targetSdkVersion
        versionCode = flutter.versionCode
        versionName = flutter.versionName
        multiDexEnabled true
        ndk {
            abiFilters 'arm64-v8a', 'armeabi-v7a', 'x86_64'//, 'armeabi', 'mips', 'mips64', 'x86'
        }
    }

    signingConfigs {
        release {
            keyAlias keystoreProperties['keyAlias']
            keyPassword keystoreProperties['keyPassword']
            storeFile keystoreProperties['storeFile'] ? file(keystoreProperties['storeFile']) : null
            storePassword keystoreProperties['storePassword']
        }
    }

    buildTypes {
        debug {
            minifyEnabled true
            shrinkResources false
            signingConfig signingConfigs.debug
            debuggable true
        }
        release {
            minifyEnabled true
            shrinkResources false
            signingConfig = signingConfigs.release
            debuggable false
            jniDebuggable false
            renderscriptDebuggable false
            zipAlignEnabled true
            ndk {
                debugSymbolLevel 'FULL'
            }
        }
    }
}

flutter {
    source = "../.."
}

dependencies {
    implementation 'androidx.window:window:1.4.0'
    implementation 'androidx.window:window-java:1.4.0'
    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.1.5'
    def multidex_version = "2.0.1"
    implementation "androidx.multidex:multidex:$multidex_version"
    implementation 'com.google.android.material:material:1.12.0'
}